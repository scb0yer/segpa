<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Physique-Chimie 6e · Les propriétés de la matière</title>
    <style>
      :root {
        --ink: #102a43;
        --muted: #5c6f82;
        --blue: #1877d2;
        --blue2: #eaf5ff;
        --green: #168a50;
        --green2: #eaf9f0;
        --orange: #ef7d22;
        --orange2: #fff2e8;
        --purple: #7b3fc6;
        --purple2: #f4ecff;
        --yellow: #f3b51b;
        --yellow2: #fff8dc;
        --red: #c93c3c;
        --bg: #f5f9fc;
        --card: #fff;
        --line: #d8e5ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      button {
        font: inherit;
      }
      .topbar {
        background: #0c3f72;
        color: white;
        padding: 14px 18px;
      }
      .topbar a {
        color: white;
        text-decoration: none;
        font-weight: 800;
      }
      .hero {
        max-width: 1000px;
        margin: 22px auto 0;
        padding: 0 18px;
      }
      .hero-card {
        background: linear-gradient(135deg, #e8f4ff, #fff8e8);
        border: 1px solid #cfe1ef;
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 10px 30px #17324d12;
      }
      .eyebrow {
        font-weight: 900;
        color: var(--blue);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.78rem;
      }
      h1 {
        margin: 0.25rem 0 0.35rem;
        font-size: clamp(1.8rem, 5vw, 3.1rem);
        line-height: 1;
      }
      .subtitle {
        color: var(--muted);
        margin: 0;
        max-width: 700px;
      }
      .wrap {
        max-width: 1000px;
        margin: 18px auto 60px;
        padding: 0 18px;
      }
      .panel {
        background: white;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 18px;
        box-shadow: 0 8px 24px #17324d0b;
      }
      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
      }
      .pill {
        background: var(--blue2);
        color: #075ca8;
        border-radius: 999px;
        padding: 8px 12px;
        font-weight: 800;
      }
      .btn {
        border: 0;
        border-radius: 13px;
        padding: 11px 16px;
        font-weight: 900;
        cursor: pointer;
        background: var(--blue);
        color: white;
      }
      .btn.secondary {
        background: #edf3f8;
        color: var(--ink);
      }
      .btn:focus-visible,
      .choice:focus-visible {
        outline: 4px solid #9dd1ff;
        outline-offset: 2px;
      }
      .progress-shell {
        height: 12px;
        background: #e8eef4;
        border-radius: 999px;
        overflow: hidden;
        margin: 16px 0;
      }
      .progress {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--blue), var(--purple));
        transition: 0.25s;
      }
      .question-card {
        margin-top: 16px;
        border: 2px solid #d9e8f4;
        border-radius: 20px;
        overflow: hidden;
      }
      .qhead {
        padding: 12px 16px;
        background: #eef7ff;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }
      .qnum {
        font-weight: 950;
        color: var(--blue);
      }
      .theme {
        font-size: 0.86rem;
        font-weight: 850;
        color: var(--muted);
      }
      .qbody {
        padding: 20px;
      }
      .qbody h2 {
        font-size: 1.3rem;
        margin: 0 0 16px;
        line-height: 1.3;
      }
      .choices {
        display: grid;
        gap: 10px;
      }
      .choice {
        width: 100%;
        text-align: left;
        border: 2px solid #dbe7f0;
        background: white;
        border-radius: 14px;
        padding: 13px 14px;
        cursor: pointer;
        font-weight: 750;
        color: var(--ink);
      }
      .choice:hover {
        border-color: #8ec7f4;
        background: #f7fbff;
      }
      .choice.correct {
        border-color: #55b77c;
        background: #eaf9f0;
      }
      .choice.wrong {
        border-color: #df7777;
        background: #fff0f0;
      }
      .choice:disabled {
        cursor: default;
        color: var(--ink);
      }
      .feedback {
        display: none;
        margin-top: 15px;
        padding: 13px 14px;
        border-radius: 14px;
        font-weight: 700;
      }
      .feedback.good {
        display: block;
        background: var(--green2);
        color: #12683f;
      }
      .feedback.bad {
        display: block;
        background: #fff0f0;
        color: #9e2929;
      }
      .explain {
        font-weight: 600;
        margin-top: 6px;
        color: inherit;
      }
      .nextrow {
        display: flex;
        justify-content: flex-end;
        margin-top: 16px;
      }
      .results {
        display: none;
        text-align: center;
        padding: 26px;
      }
      .score {
        font-size: 3rem;
        font-weight: 950;
        color: var(--blue);
        margin: 6px 0;
      }
      .level {
        font-weight: 900;
        font-size: 1.2rem;
      }
      .review {
        margin-top: 18px;
        text-align: left;
      }
      .review-item {
        border-top: 1px solid var(--line);
        padding: 12px 0;
      }
      .legend {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .tag {
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 850;
      }
      .t1 {
        background: var(--blue2);
        color: #075ca8;
      }
      .t2 {
        background: var(--green2);
        color: #12683f;
      }
      .t3 {
        background: var(--orange2);
        color: #a94d0d;
      }
      .t4 {
        background: var(--purple2);
        color: #6230a1;
      }
      .t5 {
        background: var(--yellow2);
        color: #805e00;
      }
      .small {
        font-size: 0.9rem;
        color: var(--muted);
      }
      @media (max-width: 600px) {
        .hero-card {
          padding: 18px;
        }
        .qbody {
          padding: 16px;
        }
        .controls {
          align-items: stretch;
        }
        .controls .btn {
          width: 100%;
        }
      }
      @media print {
        .topbar,
        .controls,
        .nextrow {
          display: none !important;
        }
        .hero {
          margin-top: 0;
        }
        .panel,
        .hero-card {
          box-shadow: none;
        }
        .wrap {
          margin-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar"><a href="/">← Retour à l'accueil</a></div>

    <header class="hero">
      <div class="hero-card">
        <div class="eyebrow">Physique-Chimie · 6e</div>
        <h1>Les propriétés de la matière</h1>
        <p class="subtitle">
          Entraîne-toi avec un QCM interactif. Les questions sont mélangées à
          chaque partie et tu obtiens une explication après chaque réponse.
        </p>
        <div class="legend">
          <span class="tag t1">Propriétés</span
          ><span class="tag t2">Environnement</span>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="panel" id="quizPanel">
        <div class="controls">
          <div>
            <span class="pill" id="counter">Question 1 / 15</span>
            <span class="pill" id="liveScore">Score : 0</span>
          </div>
          <button class="btn secondary" id="restart">Nouvelle série</button>
        </div>
        <div class="progress-shell">
          <div class="progress" id="progress"></div>
        </div>

        <div class="question-card" id="questionCard">
          <div class="qhead">
            <span class="qnum" id="qnum">Question 1</span
            ><span class="theme" id="theme"></span>
          </div>
          <div class="qbody">
            <h2 id="question"></h2>
            <div class="choices" id="choices"></div>
            <div class="feedback" id="feedback"></div>
            <div class="nextrow">
              <button class="btn" id="next" style="display: none">
                Question suivante →
              </button>
            </div>
          </div>
        </div>

        <div class="results" id="results">
          <div class="small">Série terminée</div>
          <div class="score" id="finalScore"></div>
          <div class="level" id="level"></div>
          <p id="resultText"></p>
          <button class="btn" id="again">Refaire une série</button>
          <div class="review" id="review"></div>
        </div>
      </section>
    </main>

    <script>
      const BANK = [
        {
          t: "Propriétés",
          q: "Une propriété d’un matériau, c’est…",
          c: [
            "une caractéristique que l’on peut observer, tester ou mesurer",
            "le nom de l’objet fabriqué",
            "celui à qui appartient le matériau",
          ],
          a: 0,
          e: "Une propriété est une caractéristique observable, testable ou mesurable.",
        },
        {
          t: "Propriétés",
          q: "Quelle propriété indique qu’un matériau peut être attiré par un aimant ?",
          c: ["la transparence", "le magnétisme", "la sonorité"],
          a: 1,
          e: "Le magnétisme concerne l’action d’un aimant sur le matériau.",
        },
        {
          t: "Propriétés",
          q: "Quelle propriété indique qu’on peut voir à travers un matériau ?",
          c: ["la transparence", "l’élasticité", "la masse"],
          a: 0,
          e: "Un matériau transparent laisse passer la lumière et permet de voir à travers.",
        },
        {
          t: "Propriétés",
          q: "Quelle propriété indique qu’un matériau laisse passer le courant électrique ?",
          c: ["la conductivité électrique", "la sonorité", "le magnétisme"],
          a: 0,
          e: "Un matériau conducteur électrique permet au courant de circuler.",
        },
        {
          t: "Propriétés",
          q: "Un matériau se déforme puis reprend sa forme. Quelle propriété observe-t-on ?",
          c: ["l’élasticité", "la transparence", "la masse"],
          a: 0,
          e: "Un matériau élastique reprend sa forme après avoir été déformé.",
        },
        {
          t: "Propriétés",
          q: "Quelle propriété mesure-t-on en grammes (g) ?",
          c: ["la masse", "le magnétisme", "la sonorité"],
          a: 0,
          e: "La masse se mesure notamment en grammes ou en kilogrammes.",
        },

        {
          t: "Propriétés",
          q: "Pour tester le magnétisme d’un matériau, quel objet est le plus utile ?",
          c: ["un aimant", "une balance", "une règle"],
          a: 0,
          e: "On approche un aimant et on observe si le matériau est attiré.",
        },
        {
          t: "Propriétés",
          q: "Si un matériau est magnétique, que doit-on observer lors du test ?",
          c: [
            "il est attiré par l’aimant",
            "il devient transparent",
            "il devient plus léger",
          ],
          a: 0,
          e: "Un matériau magnétique est attiré par un aimant.",
        },
        {
          t: "Propriétés",
          q: "Pour mesurer la masse d’un objet, on utilise…",
          c: ["une balance", "un aimant", "une ampoule"],
          a: 0,
          e: "Une balance permet de mesurer la masse.",
        },
        {
          t: "Propriétés",
          q: "On place un matériau dans un circuit électrique. L’ampoule s’allume. Que peut-on conclure ?",
          c: [
            "le matériau conduit l’électricité",
            "le matériau est magnétique",
            "le matériau est transparent",
          ],
          a: 0,
          e: "L’ampoule allumée montre que le courant traverse le matériau.",
        },
        {
          t: "Propriétés",
          q: "Dans un circuit de test, l’ampoule reste éteinte. Quelle conclusion est la plus adaptée ?",
          c: [
            "le matériau testé ne conduit pas l’électricité dans ce test",
            "le matériau est forcément léger",
            "le matériau est forcément transparent",
          ],
          a: 0,
          e: "Dans les conditions du test, le courant ne traverse pas le matériau.",
        },
        {
          t: "Propriétés",
          q: "Comment tester l’élasticité ?",
          c: [
            "déformer légèrement le matériau puis voir s’il reprend sa forme",
            "le poser sur une balance",
            "le mettre près d’un aimant",
          ],
          a: 0,
          e: "L’élasticité concerne la capacité à reprendre sa forme après déformation.",
        },

        {
          t: "Propriétés",
          q: "Je veux fabriquer un tableau sur lequel aimanter des cartes postales. Quelle propriété est indispensable ?",
          c: ["être magnétique", "être transparent", "être élastique"],
          a: 0,
          e: "Le tableau doit pouvoir être attiré par les aimants : il faut donc un matériau magnétique.",
        },
        {
          t: "Propriétés",
          q: "Pour fabriquer une protection autour d’un fil électrique, quelle propriété recherche-t-on ?",
          c: [
            "ne pas conduire l’électricité",
            "être magnétique",
            "résonner fortement",
          ],
          a: 0,
          e: "Une protection électrique doit être isolante, donc ne pas laisser passer le courant.",
        },
        {
          t: "Propriétés",
          q: "Pourquoi choisit-on un matériau plutôt qu’un autre pour fabriquer un objet ?",
          c: [
            "parce que ses propriétés répondent aux besoins de l’objet",
            "uniquement parce qu’il est joli",
            "au hasard",
          ],
          a: 0,
          e: "Le choix dépend des propriétés utiles et des contraintes de l’objet.",
        },

        {
          t: "Environnement",
          q: "Parmi ces familles, laquelle se dégrade généralement le plus rapidement dans la nature ?",
          c: ["papier et carton", "verre", "plastique"],
          a: 0,
          e: "Le papier et le carton se dégradent généralement bien plus vite que le verre ou les plastiques.",
        },
        {
          t: "Environnement",
          q: "Quels déchets mettent très longtemps à disparaître dans la nature ?",
          c: [
            "une bouteille en plastique et une canette en aluminium",
            "un trognon de pomme et une peau de banane",
            "une feuille morte et un morceau de fruit",
          ],
          a: 0,
          e: "Les plastiques et les métaux peuvent persister très longtemps dans l’environnement.",
        },
        {
          t: "Environnement",
          q: "Parmi ces matériaux, lequel peut persister extrêmement longtemps dans l’environnement ?",
          c: ["le verre", "le papier", "le carton"],
          a: 0,
          e: "Le verre est extrêmement persistant dans l’environnement.",
        },
        {
          t: "Environnement",
          q: "Pourquoi dit-on que les durées de décomposition sont souvent indicatives ?",
          c: [
            "elles dépendent des conditions du milieu",
            "parce qu’on ne peut jamais comparer des matériaux",
            "parce que tous les déchets disparaissent en un an",
          ],
          a: 0,
          e: "Eau, lumière, température, taille de l’objet et autres conditions influencent la dégradation.",
        },
        {
          t: "Environnement",
          q: "Un plastique qui se casse en très petits morceaux a-t-il forcément disparu ?",
          c: ["non", "oui, toujours", "oui, s’il n’est plus visible"],
          a: 0,
          e: "Le plastique peut se fragmenter en microplastiques sans disparaître complètement.",
        },
        {
          t: "Environnement",
          q: "Un matériau recyclable est un matériau qui…",
          c: [
            "peut être récupéré et transformé pour fabriquer de nouveaux produits",
            "disparaît forcément tout seul dans la nature",
            "est toujours fabriqué en bois",
          ],
          a: 0,
          e: "Le recyclage consiste à récupérer et transformer une matière pour la réutiliser.",
        },
        {
          t: "Environnement",
          q: "Un matériau biodégradable peut…",
          c: [
            "être décomposé naturellement par des êtres vivants dans certaines conditions",
            "être attiré par un aimant",
            "conduire forcément l’électricité",
          ],
          a: 0,
          e: "La biodégradation est une décomposition naturelle liée à l’action d’êtres vivants, notamment des micro-organismes.",
        },
        {
          t: "Environnement",
          q: "« Recyclable » et « biodégradable » veulent-ils dire la même chose ?",
          c: ["non", "oui", "seulement pour le verre"],
          a: 0,
          e: "Un objet peut être recyclable sans être biodégradable.",
        },
        {
          t: "Environnement",
          q: "Une canette en aluminium est recyclable. Cela signifie-t-il qu’on peut la laisser dans la nature ?",
          c: ["non", "oui", "seulement dans l’herbe"],
          a: 0,
          e: "Recyclable signifie qu’elle peut entrer dans une filière de recyclage, pas qu’elle se dégrade rapidement dans la nature.",
        },
        {
          t: "Environnement",
          q: "Lequel correspond le mieux à un déchet biodégradable ?",
          c: [
            "un trognon de pomme",
            "une bouteille en verre",
            "une canette en aluminium",
          ],
          a: 0,
          e: "Un déchet organique comme un trognon peut être décomposé naturellement dans des conditions adaptées.",
        },
      ];

      const SERIES_SIZE = 15;
      let series = [],
        idx = 0,
        score = 0,
        answered = false,
        mistakes = [];

      const $ = (id) => document.getElementById(id);
      function shuffle(a) {
        return [...a].sort(() => Math.random() - 0.5);
      }
      function buildSeries() {
        const themes = [...new Set(BANK.map((x) => x.t))];
        let selected = [];
        themes.forEach((t) =>
          selected.push(...shuffle(BANK.filter((x) => x.t === t)).slice(0, 3)),
        );
        return shuffle(selected).slice(0, SERIES_SIZE);
      }
      function render() {
        const q = series[idx];
        answered = false;
        $("counter").textContent = `Question ${idx + 1} / ${series.length}`;
        $("liveScore").textContent = `Score : ${score}`;
        $("progress").style.width = `${(idx / series.length) * 100}%`;
        $("qnum").textContent = `Question ${idx + 1}`;
        $("theme").textContent = q.t;
        $("question").textContent = q.q;
        $("feedback").className = "feedback";
        $("feedback").innerHTML = "";
        $("next").style.display = "none";
        const box = $("choices");
        box.innerHTML = "";
        const order = shuffle(q.c.map((txt, i) => ({ txt, i })));
        order.forEach((o) => {
          const b = document.createElement("button");
          b.className = "choice";
          b.textContent = o.txt;
          b.onclick = () => answer(b, o.i);
          box.appendChild(b);
        });
      }
      function answer(button, chosen) {
        if (answered) return;
        answered = true;
        const q = series[idx];
        [...$("choices").children].forEach((b) => (b.disabled = true));
        const correctText = q.c[q.a];
        [...$("choices").children].forEach((b) => {
          if (b.textContent === correctText) b.classList.add("correct");
        });
        const fb = $("feedback");
        if (chosen === q.a) {
          score++;
          button.classList.add("correct");
          fb.className = "feedback good";
          fb.innerHTML = `✓ Bonne réponse !<div class="explain">${q.e}</div>`;
        } else {
          button.classList.add("wrong");
          mistakes.push({ q: q.q, good: correctText });
          fb.className = "feedback bad";
          fb.innerHTML = `✗ Pas encore.<div class="explain">${q.e}</div>`;
        }
        $("liveScore").textContent = `Score : ${score}`;
        $("next").textContent =
          idx === series.length - 1
            ? "Voir mon résultat →"
            : "Question suivante →";
        $("next").style.display = "inline-block";
      }
      function finish() {
        $("questionCard").style.display = "none";
        $("results").style.display = "block";
        $("progress").style.width = "100%";
        $("counter").textContent = "Terminé";
        $("finalScore").textContent = `${score} / ${series.length}`;
        const pct = score / series.length;
        $("level").textContent =
          pct >= 0.87
            ? "Excellent travail !"
            : pct >= 0.67
              ? "Bien joué !"
              : pct >= 0.47
                ? "Tu progresses !"
                : "Encore un peu d’entraînement.";
        $("resultText").textContent =
          "Tu peux lancer une nouvelle série : les questions changeront.";
        $("review").innerHTML = mistakes.length
          ? "<h3>À revoir</h3>" +
            mistakes
              .map(
                (m) =>
                  `<div class="review-item"><strong>${m.q}</strong><br><span class="small">Réponse attendue : ${m.good}</span></div>`,
              )
              .join("")
          : "<p>Bravo : aucune erreur dans cette série.</p>";
      }
      function start() {
        series = buildSeries();
        idx = 0;
        score = 0;
        mistakes = [];
        $("questionCard").style.display = "block";
        $("results").style.display = "none";
        render();
      }
      $("next").onclick = () => {
        idx++;
        idx < series.length ? render() : finish();
      };
      $("restart").onclick = start;
      $("again").onclick = start;
      start();
    </script>
  </body>
</html>
