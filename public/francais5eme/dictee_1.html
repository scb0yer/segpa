let current=0, player=null, playingButton=null;
const $=id=>document.getElementById(id);
function normalize(s){return s.normalize('NFC').toLocaleLowerCase('fr').trim().replace(/[’‘]/g,"'").replace(/[‐‑–−]/g,'-').replace(/\s+/g,' ')}
function stopAudio(){if(player){player.pause();player=null}if(playingButton){playingButton.classList.remove('playing');playingButton=null}$('audio-status').textContent=''}
