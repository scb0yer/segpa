<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mission Diviseurs — 3 niveaux</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel2: #172033;
        --line: #2b3a55;
        --text: #f8fafc;
        --muted: #a8b3c7;
        --accent: #38bdf8;
        --good: #22c55e;
        --bad: #ef4444;
        --card: #f8fafc;
        --ink: #102033;
        --yellow: #facc15;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        background:
          radial-gradient(
            circle at 20% 0%,
            rgba(56, 189, 248, 0.14),
            transparent 28%
          ),
          linear-gradient(180deg, #0b1222, #111827 60%, #0b1222);
        color: var(--text);
        min-height: 100vh;
      }
      button,
      input {
        font: inherit;
      }
      .wrap {
        max-width: 920px;
        margin: auto;
        padding: 24px 14px 42px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 16px;
      }
      .brand h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 44px);
      }
      .brand p {
        margin: 8px 0 0;
        color: var(--muted);
      }
      .scorebox {
        min-width: 175px;
        background: #111827;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px 16px;
        text-align: right;
      }
      .label {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.14em;
      }
      .score {
        font-size: 30px;
        font-weight: 800;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
        margin: 0 0 14px;
      }
      .tab {
        border: 1px solid var(--line);
        background: #111827;
        color: #b9c5d6;
        border-radius: 15px;
        padding: 12px 10px;
        cursor: pointer;
        text-align: left;
      }
      .tab b {
        display: block;
        color: #fff;
        font-size: 15px;
        margin-bottom: 3px;
      }
      .tab span {
        font-size: 12px;
      }
      .tab.active {
        border-color: #38bdf8;
        background: #11263c;
        box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.12) inset;
      }
      .tab.active span {
        color: #c9e8f7;
      }

      .progress-shell {
        height: 10px;
        background: #1f2a3c;
        border-radius: 999px;
        overflow: hidden;
        margin: 10px 0 20px;
      }
      .progress {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--accent), #60a5fa);
        transition: 0.35s;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 18px;
      }
      .panel {
        background: rgba(17, 24, 39, 0.95);
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
      }
      .head {
        padding: 17px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .head h2 {
        margin: 0;
        font-size: 20px;
      }
      .badge {
        font-size: 12px;
        padding: 7px 10px;
        border: 1px solid #34506f;
        border-radius: 999px;
        color: #c9e8f7;
        background: #11263c;
        white-space: nowrap;
      }
      .content {
        padding: 20px;
      }
      .story {
        background: linear-gradient(180deg, #f8fafc, #edf2f7);
        color: var(--ink);
        border-radius: 18px;
        padding: 18px;
        border: 1px solid #d6deea;
      }
      .pairs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 14px;
      }
      .pair {
        min-height: 78px;
        border-radius: 14px;
        padding: 12px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        border: 1px solid #d4dbe5;
        background: white;
      }
      .pair strong {
        font-size: 23px;
      }
      .number-card {
        margin-top: 16px;
        background: #0d1627;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
      }
      .target {
        text-align: center;
        font-size: 50px;
        font-weight: 800;
      }
      .target small {
        display: block;
        font-size: 13px;
        color: #a8b3c7;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        margin-bottom: 6px;
      }
      .rule {
        margin-top: 12px;
        text-align: center;
        color: #d8e3ef;
        font-size: 15px;
        line-height: 1.45;
      }
      .rule b {
        color: white;
      }
      .criteria {
        display: grid;
        gap: 9px;
        margin-top: 13px;
      }
      .criterion {
        background: #fff;
        border: 1px solid #d4dbe5;
        border-radius: 12px;
        padding: 10px 12px;
      }
      .criterion b {
        color: #0f4c6e;
      }
      .question-card {
        background: #f8fafc;
        color: var(--ink);
        border-radius: 18px;
        padding: 20px;
        border: 1px solid #dbe3ee;
      }
      .qnum {
        font-size: 12px;
        letter-spacing: 0.12em;
        color: #64748b;
        text-transform: uppercase;
      }
      .question-card h3 {
        font-size: 23px;
        line-height: 1.25;
        margin: 8px 0 16px;
      }
      .answers {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      button.answer {
        border: none;
        border-radius: 14px;
        padding: 14px 12px;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        background: #e8eef6;
        color: #12243a;
        border: 1px solid #d5deea;
      }
      button.answer:hover {
        background: #dfe8f2;
      }
      button.answer.correct {
        background: #dcfce7;
        border-color: #86efac;
      }
      button.answer.wrong {
        background: #fee2e2;
        border-color: #fca5a5;
      }
      .feedback {
        min-height: 58px;
        margin-top: 14px;
        border-radius: 14px;
        padding: 12px 14px;
        background: #edf3f8;
        color: #294057;
        line-height: 1.4;
      }
      .feedback.good {
        background: #dcfce7;
        color: #14532d;
      }
      .feedback.bad {
        background: #fee2e2;
        color: #7f1d1d;
      }
      .actions {
        display: flex;
        gap: 9px;
        justify-content: flex-end;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      button.next,
      button.restart,
      button.check,
      button.hint,
      button.new-number {
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 800;
        cursor: pointer;
      }
      button.next,
      button.check {
        background: var(--accent);
        color: #062033;
      }
      button.hint {
        background: #fef3c7;
        color: #713f12;
      }
      button.new-number,
      button.restart {
        background: #26364f;
        color: white;
      }
      .mini {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .mini-card {
        padding: 13px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: #121b2b;
        color: #cbd5e1;
      }
      .mini-card b {
        color: white;
      }
      .hidden {
        display: none !important;
      }
      .footer-note {
        margin-top: 18px;
        color: #7f8ca4;
        font-size: 13px;
        text-align: center;
      }

      /* Niveau 3 */
      .factor-work {
        display: grid;
        gap: 10px;
      }
      .factor-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        flex-wrap: wrap;
        background: #fff;
        border: 1px solid #d7e0ea;
        border-radius: 13px;
        padding: 10px;
        font-size: 19px;
        font-weight: 750;
      }
      .factor-row input {
        width: 68px;
        height: 44px;
        text-align: center;
        border: 2px solid #cbd5e1;
        border-radius: 10px;
        color: #102033;
        background: #fff;
        font-size: 19px;
        font-weight: 800;
      }
      .factor-row input:focus {
        outline: 3px solid rgba(56, 189, 248, 0.2);
        border-color: #38bdf8;
      }
      .factor-row.solved {
        background: #ecfdf5;
        border-color: #86efac;
      }
      .factor-row.solved input {
        border-color: #86efac;
        background: #f0fdf4;
      }
      .factor-row.current {
        border-color: #7dd3fc;
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.1);
      }
      .factor-row.locked {
        opacity: 0.48;
      }
      .factor-row.locked input {
        pointer-events: none;
        background: #eef2f7;
      }
      .factor-summary {
        margin-top: 12px;
        padding: 12px;
        border-radius: 12px;
        background: #e8eef6;
        color: #22364d;
        font-size: 14px;
      }
      .factor-summary strong {
        color: #0f172a;
      }
      .hintbox {
        margin-top: 10px;
        padding: 11px 12px;
        border-radius: 12px;
        background: #fef3c7;
        color: #713f12;
        border: 1px solid #fde68a;
      }
      .level-intro {
        font-size: 14px;
        line-height: 1.45;
      }
      .level-intro strong {
        color: #0f172a;
      }

      @media (max-width: 820px) {
        .wrap {
          max-width: 560px;
          padding: 14px 10px 30px;
        }
        .grid {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .topbar {
          align-items: stretch;
          flex-direction: column;
          gap: 10px;
          margin-bottom: 10px;
        }
        .brand h1 {
          font-size: 30px;
        }
        .brand p {
          font-size: 14px;
        }
        .scorebox {
          width: 100%;
          min-width: 0;
          text-align: left;
          padding: 10px 12px;
          border-radius: 14px;
        }
        .score {
          font-size: 24px;
        }
        .tabs {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        .tab {
          padding: 9px 11px;
        }
        .tab b {
          font-size: 14px;
        }
        .tab span {
          font-size: 11px;
        }
        .progress-shell {
          margin: 8px 0 14px;
        }
        .panel {
          border-radius: 16px;
        }
        .head {
          padding: 12px 14px;
        }
        .head h2 {
          font-size: 18px;
        }
        .badge {
          font-size: 11px;
          padding: 5px 8px;
        }
        .content {
          padding: 12px;
        }
        .story {
          padding: 13px;
          border-radius: 14px;
          font-size: 14px;
        }
        .pairs {
          gap: 6px;
          margin-top: 10px;
        }
        .pair {
          min-height: 64px;
          padding: 8px 5px;
          border-radius: 11px;
          font-size: 12px;
        }
        .pair strong {
          font-size: 20px;
        }
        .number-card {
          padding: 12px;
          margin-top: 10px;
          border-radius: 14px;
        }
        .target {
          font-size: 40px;
        }
        .rule {
          font-size: 13px;
        }
        .mini {
          grid-template-columns: 1fr;
          gap: 6px;
          margin-top: 10px;
        }
        .mini-card {
          padding: 9px 11px;
          font-size: 12px;
        }
        .question-card {
          padding: 14px;
          border-radius: 14px;
        }
        .question-card h3 {
          font-size: 20px;
          margin: 6px 0 12px;
        }
        .answers {
          grid-template-columns: 1fr;
          gap: 7px;
        }
        button.answer {
          padding: 12px 10px;
          font-size: 16px;
        }
        .feedback {
          font-size: 14px;
          padding: 10px 11px;
          min-height: 52px;
        }
        .actions button {
          flex: 1 1 auto;
        }
        .footer-note {
          font-size: 11px;
          margin-top: 12px;
        }
        .factor-row {
          font-size: 17px;
          gap: 6px;
        }
        .factor-row input {
          width: 60px;
          height: 40px;
          font-size: 17px;
        }
      }
      @media (max-width: 390px) {
        .wrap {
          padding-left: 7px;
          padding-right: 7px;
        }
        .brand h1 {
          font-size: 27px;
        }
        .pairs {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <div class="brand">
          <h1>Mission Diviseurs</h1>
          <p>
            Trois niveaux pour comprendre, reconnaître et trouver les diviseurs.
          </p>
        </div>
        <div class="scorebox">
          <div class="label">Score total</div>
          <div class="score"><span id="score">0</span> pts</div>
        </div>
      </div>

      <nav class="tabs" aria-label="Choix du niveau">
        <button class="tab active" data-level="1">
          <b>Niveau 1</b><span>Comprendre la notion</span>
        </button>
        <button class="tab" data-level="2">
          <b>Niveau 2</b><span>Critères de divisibilité</span>
        </button>
        <button class="tab" data-level="3">
          <b>Niveau 3</b><span>Trouver tous les diviseurs</span>
        </button>
      </nav>

      <div class="progress-shell">
        <div id="progress" class="progress"></div>
      </div>

      <div class="grid">
        <section class="panel">
          <div class="head">
            <h2 id="leftTitle">Repères</h2>
            <span id="levelBadge" class="badge">Niveau 1</span>
          </div>
          <div class="content">
            <div id="storyBox" class="story"></div>
            <div id="numberBox" class="number-card"></div>
            <div id="miniBox" class="mini"></div>
          </div>
        </section>

        <section class="panel">
          <div class="head">
            <h2 id="challengeTitle">Défi</h2>
            <span id="combo" class="badge">Série : 0</span>
          </div>
          <div class="content">
            <div class="question-card">
              <div id="qnum" class="qnum"></div>
              <h3 id="question"></h3>
              <div id="activity"></div>
              <div id="feedback" class="feedback">
                Choisis un niveau pour commencer.
              </div>
              <div id="hintBox" class="hintbox hidden"></div>
              <div class="actions" id="actions"></div>
            </div>
          </div>
        </section>
      </div>

      <div class="footer-note">
        3ème — Chapitre 2 • Le score est conservé quand tu changes de niveau.
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const scoreEl = $("score"),
        progressEl = $("progress"),
        storyBox = $("storyBox"),
        numberBox = $("numberBox"),
        miniBox = $("miniBox"),
        qnum = $("qnum"),
        qEl = $("question"),
        activity = $("activity"),
        feedback = $("feedback"),
        actions = $("actions"),
        combo = $("combo"),
        hintBox = $("hintBox"),
        levelBadge = $("levelBadge");

      let level = 1,
        score = 0,
        streak = 0,
        index = 0,
        locked = false;
      let currentL2 = null,
        currentL3 = null,
        l3Step = 0,
        l3Mistakes = 0;

      const level1Questions = [
        {
          target: 12,
          pairs: ["1 × 12", "2 × 6", "3 × 4"],
          hint: "Les diviseurs de 12 apparaissent par couples.",
          ask: "Lequel de ces nombres est un diviseur de 12 ?",
          choices: ["5", "7", "6", "11"],
          correct: "6",
          explain: "6 est un diviseur de 12 car 12 ÷ 6 = 2, sans reste.",
        },
        {
          target: 12,
          pairs: ["1 × 12", "2 × 6", "3 × 4"],
          hint: "On peut retrouver les diviseurs grâce aux multiplications qui donnent 12.",
          ask: "Quel est le partenaire de 3 pour faire 12 ?",
          choices: ["2", "3", "4", "6"],
          correct: "4",
          explain:
            "3 × 4 = 12. Donc 3 et 4 sont tous les deux des diviseurs de 12.",
        },
        {
          target: 18,
          pairs: ["1 × 18", "2 × 9", "3 × 6"],
          hint: "Cherche les couples de nombres dont le produit vaut 18.",
          ask: "Quel nombre complète : 18 = 2 × ... ?",
          choices: ["6", "7", "8", "9"],
          correct: "9",
          explain: "18 = 2 × 9. Donc 2 et 9 sont des diviseurs de 18.",
        },
        {
          target: 18,
          pairs: ["1 × 18", "2 × 9", "3 × 6"],
          hint: "Quand on trouve un diviseur, on cherche son partenaire.",
          ask: "Quel est le partenaire de 3 pour faire 18 ?",
          choices: ["4", "5", "6", "9"],
          correct: "6",
          explain: "3 × 6 = 18. Donc 3 et 6 forment un couple de diviseurs.",
        },
        {
          target: 20,
          pairs: ["1 × 20", "2 × 10", "4 × 5"],
          hint: "Liste les couples sans en oublier.",
          ask: "Quelle liste contient tous les diviseurs de 20 ?",
          choices: [
            "1 ; 2 ; 4 ; 5 ; 10 ; 20",
            "1 ; 2 ; 5 ; 10 ; 20",
            "2 ; 4 ; 5 ; 10",
            "1 ; 2 ; 4 ; 8 ; 10 ; 20",
          ],
          correct: "1 ; 2 ; 4 ; 5 ; 10 ; 20",
          explain:
            "Les couples sont 1×20, 2×10 et 4×5. On obtient donc 1, 2, 4, 5, 10 et 20.",
        },
        {
          target: 15,
          pairs: ["1 × 15", "3 × 5"],
          hint: "Un nombre est diviseur seulement si la division tombe juste.",
          ask: "7 est-il un diviseur de 15 ?",
          choices: ["Oui", "Non"],
          correct: "Non",
          explain:
            "Non : 15 ÷ 7 ne donne pas un entier. Il reste quelque chose.",
        },
        {
          target: 24,
          pairs: ["1 × 24", "2 × 12", "3 × 8", "4 × 6"],
          hint: "On cherche toutes les façons de multiplier deux nombres entiers pour obtenir 24.",
          ask: "Lequel de ces couples est faux ?",
          choices: ["1 × 24", "2 × 12", "4 × 6", "5 × 4"],
          correct: "5 × 4",
          explain:
            "5 × 4 = 20, pas 24. Ce n’est donc pas un couple de diviseurs de 24.",
        },
        {
          target: 24,
          pairs: ["1 × 24", "2 × 12", "3 × 8", "4 × 6"],
          hint: "Une fois tous les couples trouvés, on range les diviseurs dans l’ordre croissant.",
          ask: "Combien de diviseurs possède 24 ?",
          choices: ["6", "7", "8", "10"],
          correct: "8",
          explain:
            "Les diviseurs sont 1, 2, 3, 4, 6, 8, 12 et 24 : il y en a 8.",
        },
        {
          target: 13,
          pairs: ["1 × 13"],
          hint: "Certains nombres n’ont que deux diviseurs.",
          ask: "Quels sont les seuls diviseurs de 13 ?",
          choices: ["1 et 13", "2 et 13", "1, 2 et 13", "1, 3 et 13"],
          correct: "1 et 13",
          explain:
            "13 n’est divisible que par 1 et par lui-même. C’est un nombre premier.",
        },
      ];

      const criteria = {
        2: {
          name: "2",
          text: "Un nombre est divisible par 2 si son chiffre des unités est 0, 2, 4, 6 ou 8.",
        },
        3: {
          name: "3",
          text: "Pour savoir si un nombre est divisible par 3, additionne tous ses chiffres. Le résultat doit être un multiple de 3. Exemple : 123 → 1 + 2 + 3 = 6. Comme 6 est un multiple de 3, 123 est divisible par 3.",
        },
        5: {
          name: "5",
          text: "Un nombre est divisible par 5 si son chiffre des unités est 0 ou 5.",
        },
        9: {
          name: "9",
          text: "Pour savoir si un nombre est divisible par 9, additionne tous ses chiffres. Le résultat doit être un multiple de 3. Exemple : 243 → 2 + 4 + 3 = 9. Comme 9 est un multiple de 3, 243 est divisible par 9.",
        },
      };
      const divisorsL2 = [2, 3, 5, 9];

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }
      function shuffle(a) {
        return [...a].sort(() => Math.random() - 0.5);
      }
      function factorPairs(n) {
        const p = [];
        for (let d = 1; d * d <= n; d++) if (n % d === 0) p.push([d, n / d]);
        return p;
      }
      function allDivisors(n) {
        const a = [];
        for (let d = 1; d <= n; d++) if (n % d === 0) a.push(d);
        return a;
      }
      function addScore(base = 100) {
        streak++;
        const gain = base + Math.min(streak - 1, 4) * 20;
        score += gain;
        scoreEl.textContent = score;
        combo.textContent = `Série : ${streak}`;
        return gain;
      }
      function loseStreak() {
        streak = 0;
        combo.textContent = "Série : 0";
      }
      function setFeedback(text, type = "") {
        feedback.className = "feedback" + (type ? ` ${type}` : "");
        feedback.textContent = text;
      }
      function setCommonMini() {
        miniBox.innerHTML = `
    <div class="mini-card"><b>Diviseur</b><br>Il divise exactement le nombre, sans reste.</div>
    <div class="mini-card"><b>Couple</b><br>Deux nombres qui se multiplient pour retrouver le nombre étudié.</div>
    <div class="mini-card"><b>À retenir</b><br>1 et le nombre lui-même sont toujours des diviseurs.</div>`;
      }
      function button(label, cls, fn) {
        const b = document.createElement("button");
        b.className = cls;
        b.textContent = label;
        b.onclick = fn;
        actions.appendChild(b);
        return b;
      }
      function switchLevel(n) {
        level = n;
        index = 0;
        streak = 0;
        locked = false;
        combo.textContent = "Série : 0";
        hintBox.classList.add("hidden");
        document
          .querySelectorAll(".tab")
          .forEach((t) =>
            t.classList.toggle("active", Number(t.dataset.level) === n),
          );
        levelBadge.textContent = `Niveau ${n}`;
        if (n === 1) renderL1();
        else if (n === 2) newL2();
        else newL3();
      }
      document
        .querySelectorAll(".tab")
        .forEach(
          (t) => (t.onclick = () => switchLevel(Number(t.dataset.level))),
        );

      function renderL1() {
        locked = false;
        hintBox.classList.add("hidden");
        actions.innerHTML = "";
        const q = level1Questions[index % level1Questions.length];
        progressEl.style.width = `${((index % level1Questions.length) / level1Questions.length) * 100}%`;
        qnum.textContent = `Question ${(index % level1Questions.length) + 1} / ${level1Questions.length}`;
        qEl.textContent = q.ask;
        storyBox.innerHTML = `<strong>${q.hint}</strong><div class="pairs">${q.pairs.map((p) => `<div class="pair"><span>Couple</span><strong>${p}</strong></div>`).join("")}</div>`;
        numberBox.innerHTML = `<div class="target"><small>Nombre étudié</small>${q.target}</div><div class="rule"><b>Idée clé :</b> si a × b = ${q.target}, alors a et b sont des diviseurs de ${q.target}.</div>`;
        setCommonMini();
        activity.innerHTML = `<div class="answers"></div>`;
        const ans = activity.querySelector(".answers");
        q.choices.forEach((c) => {
          const b = document.createElement("button");
          b.className = "answer";
          b.textContent = c;
          b.onclick = () => {
            if (locked) return;
            locked = true;
            [...ans.children].forEach((x) => {
              if (x.textContent === q.correct) x.classList.add("correct");
            });
            if (c === q.correct) {
              const gain = addScore();
              setFeedback(
                `Bonne réponse. +${gain} points. ${q.explain}`,
                "good",
              );
            } else {
              loseStreak();
              b.classList.add("wrong");
              setFeedback(`Pas tout à fait. ${q.explain}`, "bad");
            }
            button("Question suivante →", "next", () => {
              index = (index + 1) % level1Questions.length;
              renderL1();
            });
          };
          ans.appendChild(b);
        });
        setFeedback("Choisis une réponse.");
      }

      /* Niveau 2 : génération quasi illimitée par combinaison aléatoire nombre/diviseur */
      function makeL2() {
        const d = divisorsL2[rand(0, divisorsL2.length - 1)];
        const wantDivisible = Math.random() < 0.5;
        let n;
        if (wantDivisible) {
          n = d * rand(4, 111);
          if (n > 999) n = d * rand(4, 80);
        } else {
          do {
            n = rand(12, 999);
          } while (n % d === 0);
        }
        return { d, n, yes: n % d === 0 };
      }
      function explainCriterion(d, n) {
        const digits = String(n).split("").map(Number),
          sum = digits.reduce((a, b) => a + b, 0),
          last = digits.at(-1);
        if (d === 2)
          return `Le chiffre des unités est ${last}. ${[0, 2, 4, 6, 8].includes(last) ? "Il est pair" : "Il n’est pas pair"}.`;
        if (d === 5)
          return `Le chiffre des unités est ${last}. ${[0, 5].includes(last) ? "C’est 0 ou 5" : "Ce n’est ni 0 ni 5"}.`;
        return `Somme des chiffres : ${digits.join(" + ")} = ${sum}. ${sum % d === 0 ? sum + " est" : sum + " n’est pas"} un multiple de ${d}.`;
      }
      function newL2() {
        currentL2 = makeL2();
        locked = false;
        hintBox.classList.add("hidden");
        actions.innerHTML = "";
        const { d, n, yes } = currentL2;
        progressEl.style.width = "66%";
        qnum.textContent = "Niveau 2 • Nouveau nombre à chaque défi";
        qEl.textContent = `${n} est-il divisible par ${d} ?`;
        storyBox.innerHTML = `<div class="level-intro"><strong>Critère de divisibilité par ${d}</strong><div class="criteria"><div class="criterion">${criteria[d].text}</div></div></div>`;
        numberBox.innerHTML = `<div class="target"><small>Nombre à tester</small>${n}</div><div class="rule"><b>Question :</b> ${d} est-il un diviseur de ${n} ?</div>`;
        miniBox.innerHTML = `
    <div class="mini-card"><b>Par 2</b><br>Le nombre finit par 0, 2, 4, 6 ou 8.</div>
    <div class="mini-card"><b>Par 3 ou 9</b><br>Additionne les chiffres : la somme doit être un multiple de 3.</div>
    <div class="mini-card"><b>Par 5</b><br>Le nombre finit par 0 ou 5.</div>`;
        activity.innerHTML = `<div class="answers"><button class="answer">Oui</button><button class="answer">Non</button></div>`;
        [...activity.querySelectorAll(".answer")].forEach(
          (b) =>
            (b.onclick = () => {
              if (locked) return;
              locked = true;
              const chosen = b.textContent === "Oui";
              [...activity.querySelectorAll(".answer")].forEach((x) => {
                if ((x.textContent === "Oui") === yes)
                  x.classList.add("correct");
              });
              const detail = explainCriterion(d, n);
              if (chosen === yes) {
                const gain = addScore();
                setFeedback(
                  `Bonne réponse. +${gain} points. ${detail}`,
                  "good",
                );
              } else {
                loseStreak();
                b.classList.add("wrong");
                setFeedback(`Pas tout à fait. ${detail}`, "bad");
              }
              button("Autre nombre →", "next", newL2);
            }),
        );
        setFeedback(`Utilise le critère de divisibilité par ${d}.`);
      }

      /* Niveau 3 : nombres composites strictement inférieurs à 50.
   Les exercices sont générés à partir de cette banque et les 20 derniers nombres sont évités. */
      const l3Bank = [];
      for (let n = 12; n < 50; n++) {
        const p = factorPairs(n);
        if (p.length >= 2 && p.length <= 7 && allDivisors(n).length > 2)
          l3Bank.push(n);
      }
      let recentL3 = [];
      function pickL3Number() {
        const available = l3Bank.filter((n) => !recentL3.includes(n));
        const pool = available.length ? available : l3Bank;
        const n = pool[rand(0, pool.length - 1)];
        recentL3.push(n);
        if (recentL3.length > 20) recentL3.shift();
        return n;
      }
      function newL3() {
        const n = pickL3Number(),
          pairs = factorPairs(n);
        currentL3 = { n, pairs };
        l3Step = 0;
        l3Mistakes = 0;
        locked = false;
        hintBox.classList.add("hidden");
        actions.innerHTML = "";
        progressEl.style.width = "100%";
        qnum.textContent = `Niveau 3 • ${pairs.length} couple${pairs.length > 1 ? "s" : ""} à trouver`;
        qEl.textContent = `Trouve tous les diviseurs de ${n} en complétant les couples.`;
        storyBox.innerHTML = `
    <div class="level-intro"><strong>Méthode :</strong> commence toujours par le plus petit diviseur.
    Trouve son partenaire, puis cherche le diviseur suivant. Quand les deux nombres du couple se rejoignent, tu as terminé.</div>
    <div class="criteria">
      <div class="criterion"><b>Exemple avec 18 :</b> 1 × 18, puis 2 × 9. Ensuite 3 divise 9, donc 3 divise aussi 18 : 3 × 6 = 18.</div>
    </div>`;
        numberBox.innerHTML = `<div class="target"><small>Nombre étudié</small>${n}</div><div class="rule"><b>But :</b> construire toi-même tous les couples de diviseurs, dans l’ordre.</div>`;
        miniBox.innerHTML = `
    <div class="mini-card"><b>1. Commence par 1</b><br>1 × ? = ${n}</div>
    <div class="mini-card"><b>2. Avance</b><br>Teste ensuite les petits nombres dans l’ordre.</div>
    <div class="mini-card"><b>3. Partenaires</b><br>L’ordre ne compte pas : 3 × 6 et 6 × 3 représentent le même couple.</div>`;
        renderFactorRows();
        setFeedback(
          "Complète le premier couple, puis vérifie. Tu avanceras couple par couple.",
        );
      }
      function renderFactorRows() {
        const { n, pairs } = currentL3;
        activity.innerHTML = `<div class="factor-work"></div><div id="factorSummary" class="factor-summary"><strong>Diviseurs trouvés :</strong> aucun pour l’instant.</div>`;
        const work = activity.querySelector(".factor-work");
        pairs.forEach((pair, i) => {
          const row = document.createElement("div");
          row.className =
            "factor-row " +
            (i < l3Step ? "solved" : i === l3Step ? "current" : "locked");
          if (i === 0) {
            row.innerHTML = `<span>${n} =</span><span>1</span><span>×</span><input inputmode="numeric" aria-label="Partenaire de 1" ${i !== l3Step ? "disabled" : ""}>`;
            if (i < l3Step) row.querySelector("input").value = pair[1];
          } else {
            row.innerHTML = `<span>${n} =</span><input inputmode="numeric" aria-label="Premier diviseur" ${i !== l3Step ? "disabled" : ""}><span>×</span><input inputmode="numeric" aria-label="Partenaire" ${i !== l3Step ? "disabled" : ""}>`;
            if (i < l3Step) {
              row.querySelectorAll("input")[0].value = pair[0];
              row.querySelectorAll("input")[1].value = pair[1];
            }
          }
          work.appendChild(row);
        });
        updateFactorSummary();
        actions.innerHTML = "";
        if (l3Step < pairs.length) {
          button("Vérifier", "check", checkL3);
          button("Indice", "hint", showL3Hint);
        } else {
          button("Nouveau nombre →", "next", newL3);
        }
        const current = work.children[l3Step];
        if (current) {
          const inp = current.querySelector("input:not([disabled])");
          if (inp) setTimeout(() => inp.focus(), 0);
        }
      }
      function updateFactorSummary() {
        const box = $("factorSummary");
        if (!box) return;
        if (l3Step === 0) {
          box.innerHTML =
            "<strong>Diviseurs trouvés :</strong> aucun pour l’instant.";
          return;
        }
        const vals = new Set();
        currentL3.pairs.slice(0, l3Step).forEach(([a, b]) => {
          vals.add(a);
          vals.add(b);
        });
        box.innerHTML = `<strong>Diviseurs trouvés :</strong> ${[...vals].sort((a, b) => a - b).join(" ; ")}`;
      }
      function checkL3() {
        const { pairs } = currentL3,
          expected = pairs[l3Step];
        const row = activity.querySelectorAll(".factor-row")[l3Step];
        const inputs = [...row.querySelectorAll("input")];
        const vals = inputs.map((i) => Number(i.value));
        const ok =
          l3Step === 0
            ? vals[0] === expected[1]
            : (vals[0] === expected[0] && vals[1] === expected[1]) ||
              (vals[0] === expected[1] && vals[1] === expected[0]);
        if (ok) {
          const gain = addScore(120);
          l3Step++;
          l3Mistakes = 0;
          hintBox.classList.add("hidden");
          const shown =
            l3Step === 0 ? `1 × ${vals[0]}` : `${vals[0]} × ${vals[1]}`;
          setFeedback(
            `Exact ! ${shown} = ${currentL3.n}. L’ordre des facteurs n’a pas d’importance. +${gain} points.`,
            "good",
          );
          if (l3Step === pairs.length) {
            renderFactorRows();
            const divs = allDivisors(currentL3.n);
            setFeedback(
              `Bravo ! Tu as trouvé tous les diviseurs de ${currentL3.n} : ${divs.join(" ; ")}.`,
              "good",
            );
          } else renderFactorRows();
        } else {
          loseStreak();
          l3Mistakes++;
          setFeedback(
            "Ce couple n’est pas encore correct. Vérifie que le produit donne bien le nombre étudié et que tu avances avec le plus petit diviseur possible.",
            "bad",
          );
          if (l3Mistakes >= 2) showL3Hint();
        }
      }
      function showL3Hint() {
        const { n, pairs } = currentL3,
          [a, b] = pairs[l3Step];
        let msg;
        if (l3Step === 0) msg = `Indice : 1 × combien pour faire ${n} ?`;
        else {
          const prev = pairs[l3Step - 1][0];
          msg = `Indice : après ${prev}, cherche le prochain petit nombre qui divise ${n}. Essaie ${a}. ${a} × combien pour faire ${n} ?`;
        }
        hintBox.textContent = msg;
        hintBox.classList.remove("hidden");
      }
      switchLevel(1);
    </script>
  </body>
</html>
